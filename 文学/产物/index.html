<script>
(function(){
  var KEY='wzjm_dark';
  var SUN='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>浅色</span>';
  var MOON='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg><span>深色</span>';
  function apply(d){ document.body.classList.toggle('dark', d); }
  function sync(){
    var b=document.querySelector('.dm-toggle');
    if(b){ var d=document.body.classList.contains('dark'); b.innerHTML = d ? SUN : MOON; }
  }
  function buildBtn(){
    var s=document.createElement('style');
    s.textContent='.dm-toggle{position:fixed;top:16px;right:16px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:20px;cursor:pointer;font-family:var(--font-sans,\'HarmonyOS Sans SC\',\'PingFang SC\',sans-serif);font-size:13px;font-weight:600;border:1px solid var(--rc-line,#e5e7eb);background:var(--rc-surface,#fff);color:var(--rc-primary-d,#0A59F7);box-shadow:0 4px 14px rgba(31,28,23,.18);transition:transform .2s ease,background-color .35s ease,color .35s ease,border-color .35s ease}.dm-toggle:hover{transform:translateY(-2px)}';
    document.head.appendChild(s);
    var b=document.createElement('button');
    b.className='dm-toggle';
    b.setAttribute('aria-label','切换深色模式');
    b.addEventListener('click', function(){
      var d=!document.body.classList.contains('dark');
      apply(d);
      try{ localStorage.setItem(KEY, d?'1':'0'); }catch(e){}
      sync();
      broadcast(d);
    });
    document.body.appendChild(b);
  }
  function broadcast(d){
    try{
      if(window.parent!==window){ window.parent.postMessage({wzTheme:d?'dark':'light'},'*'); }
      else{ var fs=document.querySelectorAll('iframe'); for(var i=0;i<fs.length;i++){ try{ fs[i].contentWindow.postMessage({wzTheme:d?'dark':'light'},'*'); }catch(e){} } }
    }catch(e){}
  }
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  var prefers = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  apply(saved ? saved==='1' : !!prefers);
  buildBtn();
  sync();
  window.addEventListener('message', function(e){
    if(e.data && e.data.wzTheme){
      var d = e.data.wzTheme==='dark';
      apply(d);
      try{ localStorage.setItem(KEY, d?'1':'0'); }catch(err){}
      sync();
    }
  });
})();
</script>
